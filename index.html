:root{color-scheme:light;--bg:#fbf5ea;--card:#fffdf8;--ink:#3b2a1a;--mute:#8a7560;--line:#ecdfca;--teal:#0d7f7a;--teal2:#0a5f5b;--yel:#f7c52d;--soft:#f0ebdf;--red:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

}

  if(s.notes){(s.timeline=s.timeline||[]).push(...s.notes.map(n=>({id:n.id,type:"Note",text:n.text,at:n.at})));s.timeline.sort((a,b)=>(b.at||"").localeCompare(a.at||""));delete s.notes}
  return s;
}

const dirty=new Set(),busy={},again={};
function setMode(t,bad){const m=$("#mode");m.textContent=t;m.style.cssText=bad?"background:#f7c52d;color:#2a2200;padding:3px 10px;border-radius:99px;opacity:1;font-weight:600":""}
function push(s){
  if(!dbc)return;
  if(busy[s.id]){again[s.id]=1;return}
  busy[s.id]=1;dirty.add(s.id);
  const cur_=schools.find(x=>x.id===s.id)||payments.find(x=>x.id===s.id)||expenses.find(x=>x.id===s.id)||excats.find(x=>x.id===s.id)||claims.find(x=>x.id===s.id)||s;
  dbc.doc(s.id).set(JSON.parse(JSON.stringify(cur_))).then(()=>{
    if(cur_._assign){cur_._owner=cur_._assign;delete cur_._assign}
    busy[s.id]=0;if(again[s.id]){again[s.id]=0;push(s);return}
    dirty.delete(s.id);setMode("")
  }).catch(e=>{busy[s.id]=0;again[s.id]=0;if(e&&e.code==="unauthorized")return endSession("Your access changed — please sign in again.");setMode("⚠ Not synced ("+((e&&e.message)||"error")+") – saved in this browser",true);console.error("sync",e)});
}
function save(s){
  s.updated=new Date().toISOString();
  const i=schools.findIndex(x=>x.id===s.id);i<0?schools.push(s):schools[i]=s;
  cache();render();push(s);
}
function removeSchool(s){schools=schools.filter(x=>x.id!==s.id);sel=null;cache();render();if(dbc)dbc.doc(s.id).delete().catch(()=>{})}
function merge(docs){
  const loc=new Map(schools.map(s=>[s.id,s])),out=[];
  docs.forEach(d=>{const r=norm({id:d.id,...JSON.parse(JSON.stringify(d.data())),_owner:d.owner||null}),l=loc.get(d.id);
    out.push(l&&(dirty.has(d.id)||(l.updated||"")>(r.updated||""))?l:r);loc.delete(d.id)});
  loc.forEach(l=>{if(dirty.has(l.id))out.push(l)}); // local-only items still waiting to sync
  schools=out;
}

async function rpcLocal(fn,a){

  switch(fn){
    case"crm_login":{const un=String(a.p_username||"").trim().toLowerCase(),u=d.users.find(x=>x.username===un);
      if(!u||(u.pw!==a.p_password&&u.pw!==String(a.p_password||"").trim()))return{error:"invalid_login"};
      if(!u.active)return{error:"disabled"};const t=lrand();d.sessions[t]=u.id;lsave(d);return{token:t,user:lpub(u)}}
    case"crm_me":return lpub(auth());
    case"crm_logout":delete d.sessions[a.p_token];lsave(d);return true;
    case"crm_list":{const u=auth();return clone(d.docs.filter(x=>u.role==="admin"||x.owner===u.id).map(x=>({id:x.id,owner:x.owner,data:x.data})))}
    case"crm_put":{const u=auth(),id=String(a.p_id||"");if(!id||!a.p_data||typeof a.p_data!=="object")throw lerr("bad_request");
      if(a.p_owner&&u.role==="admin"&&!d.users.some(x=>x.id===a.p_owner&&x.active))throw lerr("bad_owner");
      const r=d.docs.find(x=>x.id===id);
      if(r){if(u.role!=="admin"&&r.owner!==u.id)throw lerr("forbidden");if(u.role==="admin"&&a.p_owner)r.owner=a.p_owner;r.data=clone(a.p_data)}
      else d.docs.push({id,owner:u.role==="admin"&&a.p_owner?a.p_owner:u.id,data:clone(a.p_data)});
      lsave(d);return true}
    case"crm_delete":{const u=auth();d.docs=d.docs.filter(x=>!(x.id===a.p_id&&(u.role==="admin"||x.owner===u.id)));lsave(d);return true}
    case"crm_team_list":{const u=auth();return d.users.filter(x=>u.role==="admin"||x.id===u.id).map(lpub)}
    case"crm_team_save":{const u=auth();if(u.role!=="admin")throw lerr("forbidden");
      const un=String(a.p_username||"").toLowerCase().replace(/\s+/g,""),pw=String(a.p_password||"").trim(),name=String(a.p_name||"").trim();
      if(!name)throw lerr("name_required");if(!/^[a-z0-9._-]{3,}$/.test(un))throw lerr("bad_username");
      if(d.users.some(x=>x.username===un&&x.id!==a.p_id))throw lerr("username_taken");
      let t;if(!a.p_id){if(pw.length<6)throw lerr("weak_password");t={id:"u-"+lrand().slice(0,12),username:un,name,role:"member",active:true,pw,created:new Date().toISOString(),createdBy:u.name};d.users.push(t)}
      else{t=d.users.find(x=>x.id===a.p_id);if(!t)throw lerr("not_found");if(t.role==="admin")throw lerr("admin_locked");if(pw&&pw.length<6)throw lerr("weak_password");
        t.name=name;t.username=un;if(a.p_active!==null&&a.p_active!==undefined)t.active=!!a.p_active;if(pw)t.pw=pw;
        if(pw||!t.active)for(const k of Object.keys(d.sessions))if(d.sessions[k]===t.id)delete d.sessions[k]}
      lsave(d);return lpub(t)}
    case"crm_team_delete":{const u=auth();if(u.role!=="admin")throw lerr("forbidden");const t=d.users.find(x=>x.id===a.p_id);if(!t)return true;
      if(t.role==="admin"||t.id===u.id)throw lerr("admin_locked");d.docs.forEach(x=>{if(x.owner===t.id)x.owner=u.id});
      d.users=d.users.filter(x=>x.id!==t.id);for(const k of Object.keys(d.sessions))if(d.sessions[k]===t.id)delete d.sessions[k];lsave(d);return true}
    case"crm_change_password":{const u=auth();if(u.pw!==a.p_current&&u.pw!==String(a.p_current||"").trim())throw lerr("wrong_current");
      const n=String(a.p_new||"").trim();if(n.length<6)throw lerr("weak_password");u.pw=n;lsave(d);return true}
  }

}
async function rpc(fn,args){
  if(LOCAL)return rpcLocal(fn,args);
  if(API_URL){
    let r;try{r=await fetch(API_URL.replace(/\/+$/,"")+"/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(args||{})})}
    catch(x){const e=new Error("No connection to the server. Check your internet.");e.code="network";throw e}
    let j=null;try{j=await r.json()}catch(x){}
    if(!r.ok){const m=(j&&j.message)||("HTTP "+r.status);const e=new Error(MSG[m]||m);e.code=m;throw e}
    return j;
  }
  const h={apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"};if(SUPABASE_ANON_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SUPABASE_ANON_KEY;
  let r;try{r=await fetch(SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args||{})})}
  catch(x){const e=new Error("No connection to the server. Check your internet.");e.code="network";throw e}
  let j=null;try{j=await r.json()}catch(x){}
  if(!r.ok){const m=(j&&j.message)||("HTTP "+r.status);
    const e=new Error(MSG[m]||(/Could not find the function|schema cache/i.test(m)?"Database not set up – run supabase.sql in the Supabase SQL editor.":/Invalid API key|JWT/i.test(m)?"Invalid Supabase key – check SUPABASE_ANON_KEY.":m));e.code=m;throw e}
  return j;
}

  if(type==="Deal")return"deal";if(type==="Note")return"note";
  if(type==="Task")return /^Rescheduled/.test(text)?"task_rescheduled":"task_added";
  if(type==="Update"){if(/^School added/.test(text))return"school_added";if(/^Details/.test(text))return"school_updated";if(/^Contact added/.test(text))return"contact_added";if(/^Contact updated/.test(text))return"contact_updated";if(/^Stage changed/.test(text))return"stage";return"update"}
  return /^Completed: /.test(text)?"task_done":"activity";
}

function taskCard({t,s},inS){

let ttab="today";
function tasksView(){
  const all=allTasks(),now=Date.now(),eod=new Date();eod.setHours(23,59,59,999);
  const od=all.filter(r=>new Date(r.t.due)<now),td=all.filter(r=>{const d=new Date(r.t.due);return d>=now&&d<=eod}),up=all.filter(r=>new Date(r.t.due)>eod);
  const seg=`<div class="seg2"><button class="${ttab==="today"?"on":""}" data-tt="today">Today (${od.length+td.length})</button><button class="${ttab==="upcoming"?"on":""}" data-tt="upcoming">Upcoming (${up.length})</button></div>`;
  const hd=t=>`<div class="dl2" style="margin:12px 0 8px${t.startsWith("Overdue")?";color:#b91c1c":""}">${t}</div>`;
  let body="";
  if(ttab==="today"){
    body=(od.length?hd("Overdue · "+od.length)+taskList(od):"")+(td.length?hd("Today · "+td.length)+taskList(td):"");
    if(!body)body=noMatch("🎉 Nothing due today<br><small>Open a school and tap “Add task”</small>");
  }else{
    const tm_=new Date(Date.now()+864e5).toDateString(),gs=[];
    up.forEach(r=>{const d=new Date(r.t.due),k=d.toDateString(),lab=k===tm_?"Tomorrow":d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});let g=gs[gs.length-1];if(!g||g.k!==k)gs.push(g={k,lab,items:[]});g.items.push(r)});

/* Educlawd CRM · Payments (admin only): payment plans, installments, collections
   Each plan is saved as its own document (id "pay_…") through the same crm_put / crm_list functions.
   New docs created by the admin are owned by the admin, and crm_list only returns a member's own docs,
   so payment data never reaches sales members. */
const PAY_FREQ=[["1","Monthly"],["3","Quarterly"],["6","Half-yearly"],["12","Yearly"]];
const PAY_MODES=["UPI","Bank transfer","Cheque","Cash","Card","Other"];
const PAY_N=[1,2,3,4,5];
const PST={paid:["Paid","ps-paid"],over:["Overdue","ps-over"],pend:["Pending","ps-pend"],done:["Fully paid","ps-paid"]};

let ptab="all",pf=null;const payGone=new Set();
const payKey=()=>LS+":pay:"+(me?me.id:"none");

const isPayDoc=d=>String(d.id||"").startsWith("pay_")||!!(d.data&&d.data._kind==="payment");
const toP=x=>Math.round((+x||0)*100),fromP=p=>p/100;           // money maths in paise (no float drift)
const todayISO=()=>localISO(new Date()).slice(0,10);
const inrS=n=>{n=+n||0;const a=Math.abs(n);return a>=1e7?"₹"+(n/1e7).toFixed(2).replace(/\.?0+$/,"")+" Cr":a>=1e5?"₹"+(n/1e5).toFixed(2).replace(/\.?0+$/,"")+" L":inr(n)};
const freqLabel=f=>(PAY_FREQ.find(x=>x[0]===String(f))||[0,"Custom"])[1];
const payName=p=>{const s=p.schoolId&&schools.find(x=>x.id===p.schoolId);return(s&&s.name)||p.schoolName||"Untitled"};
const paidAmt=i=>i.paidOn?(i.paidAmt??i.amount):i.amount;
function addMonths(iso,m){const[y,mo,d]=String(iso).split("-").map(Number);if(!y)return"";const t=new Date(y,mo-1+m,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return localISO(t).slice(0,10)}
/* equal split in whole rupees; the last installment absorbs the remainder so the total always matches */
function splitP(totalP,n){if(n<1)return[];const base=Math.floor(totalP/n/100)*100,a=Array(n).fill(base);a[n-1]=totalP-base*(n-1);return a}
const instSt=(i,td=todayISO())=>i.paidOn?"paid":i.due&&i.due<td?"over":"pend";
function planSum(p){
  const td=todayISO(),ins=p.installments||[],tot=toP(p.total);let paid=0,over=0,oc=0,tc=0,next=null;
  ins.forEach(i=>{const st=instSt(i,td);if(st==="paid")paid+=toP(paidAmt(i));else{if(st==="over"){over+=toP(i.amount);oc++}if(i.due===td)tc++;if(!next||(i.due||"9")<(next.due||"9"))next=i}});
  const status=ins.length&&ins.every(i=>i.paidOn)?"done":oc?"over":"pend";
  return{tot,paid,due:Math.max(0,tot-paid),over,oc,tc,next,status,pc:tot?Math.min(100,Math.round(paid*100/tot)):0,n:ins.length,np:ins.filter(i=>i.paidOn).length};
}
function mergePay(docs){
  const loc=new Map(payments.map(p=>[p.id,p])),out=[],ids=new Set(docs.map(d=>d.id));
  docs.forEach(d=>{if(payGone.has(d.id))return;const r={...JSON.parse(JSON.stringify(d.data||{})),id:d.id},l=loc.get(d.id);
    out.push(l&&(dirty.has(d.id)||(l.updated||"")>(r.updated||""))?l:r);loc.delete(d.id)});
  loc.forEach(l=>{if(dirty.has(l.id))out.push(l)});
  payGone.forEach(id=>{if(!ids.has(id))payGone.delete(id)});
  payments=out;
}
function payLog(p,text){(p.log=p.log||[]).unshift({at:new Date().toISOString(),by:me?me.name:"",text})}
function savePay(p){p.updated=new Date().toISOString();const i=payments.findIndex(x=>x.id===p.id);i<0?payments.push(p):payments[i]=p;cachePay();render();push(p)}
function removePay(p){payments=payments.filter(x=>x.id!==p.id);payGone.add(p.id);psel=null;cachePay();render();toast("🗑️","Payment plan deleted");if(dbc)dbc.doc(p.id).delete().catch(()=>{})}

function payRebuild(n){const old=pf.rows,rows=[];for(let k=0;k<n;k++){const o=old[k];rows.push(o&&o.paidOn?o:{id:(o&&o.id)||uid(),due:"",amount:0})}pf.rows=rows;pf.d.count=n;payDates();payAmounts()}
function payDates(){const st=pf.d.start||todayISO(),fq=+pf.d.freq||1;pf.rows.forEach((r,k)=>{if(!r.paidOn)r.due=addMonths(st,k*fq)})}
/* paid installments stay as they are; whatever is left of the total is split equally over the unpaid ones */
function payAmounts(){const paid=pf.rows.filter(r=>r.paidOn).reduce((a,r)=>a+toP(paidAmt(r)),0),un=pf.rows.filter(r=>!r.paidOn),sp=splitP(Math.max(0,toP(pf.d.total)-paid),un.length);un.forEach((r,k)=>{r.amount=fromP(sp[k]||0);r.manual=false})}
function payDraw(){const el=document.getElementById("pf_rows");if(!el)return;
  el.innerHTML=`<div class="prow ph"><span>#</span><span>Due date</span><span>Amount (₹)</span></div>`+pf.rows.map((r,k)=>`<div class="prow"><span class="pno">${k+1}</span>${r.paidOn?(r.editing?`<span class="plock">${fmtDate(r.due)}</span><span class="plock">PAID<button type="button" class="pedit on" data-pay="rowedit" data-k="${k}" aria-label="Done editing" title="Done">${sv(P.check||P.pencil,14)}</button></span><div class="pedrow"><label>Paid on<input type="date" data-pr="pdate" data-k="${k}" value="${esc(r.paidOn)}"></label><label>Amount received (₹)<input type="number" inputmode="decimal" min="0" step="0.01" data-pr="pamt" data-k="${k}" value="${paidAmt(r)}"></label><label>Mode<select data-pr="pmode" data-k="${k}">${optsSel(PAY_MODES,r.mode)}</select></label><label>Reference<input data-pr="pref" data-k="${k}" value="${esc(r.ref||"")}"></label></div>`:`<span class="plock">${fmtDate(r.due)}</span><span class="plock">${inr(paidAmt(r))}<em>PAID</em><button type="button" class="pedit" data-pay="rowedit" data-k="${k}" aria-label="Edit payment" title="Edit payment">${sv(P.pencil,14)}</button></span>`):`<input type="date" data-pr="due" data-k="${k}" value="${esc(r.due)}" aria-label="Installment ${k+1} due date"><input type="number" inputmode="decimal" min="0" step="0.01" data-pr="amt" data-k="${k}" value="${r.amount}" aria-label="Installment ${k+1} amount">`}</div>`).join("")+`<div class="phint" style="margin-top:8px">Change any installment and the others adjust to keep the total.</div><div class="psum" id="pf_sum"></div>`;
  document.querySelectorAll("#pf_n [data-pn]").forEach(b=>b.classList.toggle("on",+b.dataset.pn===pf.rows.length));
  paySum()}
function paySum(){const e=document.getElementById("pf_sum");if(!e)return;const s=pf.rows.reduce((a,r)=>a+toP(paidAmt(r)),0),t=toP(pf.d.total);
  if(!t){e.className="psum nil";e.textContent="Enter the total payment — the installment amounts are calculated automatically";return}
  const ok=s===t,n=pf.rows.length;e.className="psum "+(ok?"ok":"bad");
  e.innerHTML=ok?`✓ ${n===1?"Full payment":n+" installments"} · total ${inr(fromP(t))}`:`Installments add up to ${inr(fromP(s))} — ${s>t?"over":"short"} by ${inr(fromP(Math.abs(s-t)))}<button type="button" class="alt" data-pay="resplit">Split equally</button>`}
function payHint(){const h=document.getElementById("pf_hint");if(!h||!pf)return;const sid=val("pf_school"),s=schools.find(x=>x.id===sid),dv=dealTotal(s),dup=sid&&payments.some(p=>p.schoolId===sid&&p.id!==pf.d.id);
  h.innerHTML=(dv?`Deal value: <b>${inr(dv)}</b> / year incl. 18% GST${toP(pf.d.total)!==toP(dv)?` · <button type="button" data-pay="usedeal">Use this amount</button>`:""}`:"")+(dup?`<div style="color:#92400e;margin-top:3px">⚠ This school already has a payment plan.</div>`:"")}
function payCount(n){if(!pf)return;const lastPaid=pf.rows.reduce((a,r,k)=>r.paidOn?k+1:a,0);
  if(n<lastPaid)return err(`Installment ${lastPaid} is already paid — choose ${lastPaid} or more`);err("");payRebuild(n);payDraw()}
function payInput(e){const t=e.target;if(!pf||!t)return;
  if(t.id==="pf_total"){pf.d.total=t.value;payAmounts();payDraw();payHint();return}
  if(t.dataset&&t.dataset.pr){const r=pf.rows[+t.dataset.k];if(!r)return;if(/^p(date|amt|mode|ref)$/.test(t.dataset.pr)){if(t.dataset.pr==="pref")r.ref=t.value;return}if(t.dataset.pr==="amt")return payEdit(+t.dataset.k,t.value);r.due=t.value;paySum()}}
/* typing an amount: the other unpaid installments share what is left, so the total always matches */
function payEdit(k,v){
  const rows=pf.rows,r=rows[k];if(!r||r.paidOn)return;
  const total=toP(pf.d.total);
  if(!total){r.amount=v===""?0:+v;return paySum()}
  const paid=rows.filter(x=>x.paidOn).reduce((a,x)=>a+toP(paidAmt(x)),0),room=Math.max(0,total-paid);
  const others=rows.map((x,i)=>({x,i})).filter(o=>o.i!==k&&!o.x.paidOn);
  let tgt=others.filter(o=>!o.x.manual);
  if(others.length&&!tgt.length){tgt=others;tgt.forEach(o=>o.x.manual=false)}
  const fixed=others.filter(o=>!tgt.includes(o)).reduce((a,o)=>a+toP(o.x.amount),0);
  const mine=Math.min(Math.max(0,toP(v)),Math.max(0,room-fixed));
  r.amount=fromP(mine);r.manual=true;
  if(tgt.length){const sp=splitP(Math.max(0,room-mine-fixed),tgt.length);tgt.forEach((o,j)=>o.x.amount=fromP(sp[j]))}
  document.querySelectorAll("#pf_rows [data-pr=amt]").forEach(inp=>{const i=+inp.dataset.k;if(i!==k)inp.value=rows[i].amount;else if(toP(v)>mine)inp.value=r.amount});
  paySum();
}
function payChange(e){const t=e.target;if(!pf||!t)return;
  if(t.dataset&&/^p(date|amt|mode|ref)$/.test(t.dataset.pr||"")){const r=pf.rows[+t.dataset.k];if(!r)return;const k=t.dataset.pr;
    if(k==="pdate"&&t.value)r.paidOn=t.value;else if(k==="pmode")r.mode=t.value;else if(k==="pref")r.ref=t.value;
    else if(k==="pamt"){const v=toP(t.value);if(v<=0)return err("Enter the amount received");r.paidAmt=fromP(v);r.amount=fromP(v);payAmounts()}
    return payDraw()}
  if(t.id==="pf_start"||t.id==="pf_freq"){if(t.id==="pf_start")pf.d.start=t.value;else pf.d.freq=t.value;payDates();payDraw();return}
  if(t.id==="pf_school"){const o=document.getElementById("pf_sname");o.style.display=t.value==="__other"?"":"none";if(t.value==="__other")o.focus();
    const dv=dealTotal(schools.find(x=>x.id===t.value));if(dv&&!toP(pf.d.total)){pf.d.total=dv;document.getElementById("pf_total").value=dv;payAmounts();payDraw()}payHint()}}
function savePlan(){
  const d=pf.d,sid=val("pf_school"),nm=sid==="__other"?val("pf_sname"):((schools.find(s=>s.id===sid)||{}).name||"");
  if(!sid)return err("Select a school");if(!nm)return err("Enter the school / client name");
  const t=toP(d.total);if(t<=0)return err("Enter the total payment amount");
  if(pf.rows.some(r=>!r.due))return err("Every installment needs a due date");
  if(pf.rows.some(r=>!r.paidOn&&toP(r.amount)<=0))return err("Every installment needs an amount above ₹0");
  const s=pf.rows.reduce((a,r)=>a+toP(paidAmt(r)),0);if(s!==t)return err(`Installments add up to ${inr(fromP(s))} but the total is ${inr(fromP(t))}. Tap “Split equally” or adjust the amounts.`);
  const old=payments.find(x=>x.id===d.id),p={...d,_kind:"payment",schoolId:sid==="__other"?"":sid,schoolName:nm,total:fromP(t),count:pf.rows.length,start:val("pf_start"),freq:val("pf_freq"),notes:val("pf_notes"),
    installments:pf.rows.map(({manual,editing,...r})=>({...r,amount:fromP(toP(r.amount))})),created:d.created||new Date().toISOString(),createdBy:d.createdBy||(me?me.name:"")};
  payLog(p,old?`Plan updated · ${inr(p.total)} in ${p.count} installment${p.count===1?"":"s"}`:`Plan created · ${inr(p.total)} in ${p.count} installment${p.count===1?"":"s"}`);
  payFocus(p);pf=null;close();toast("💳",old?"Payment plan updated":"Payment plan created");savePay(p);
}
function paidForm(p,i){const k=p.installments.indexOf(i);

  <div class="grid">${fld("pp_amt","Amount received (₹)",i.paidOn?paidAmt(i):i.amount,"number")}${fld("pp_date","Payment date",i.paidOn||todayISO(),"date")}<div><label>Payment mode</label><select id="pp_mode">${optsSel(PAY_MODES,i.mode)}</select></div>${fld("pp_ref","Reference / UTR / cheque no.",i.ref||"")}</div>

function payAct(el){

  if(a==="save")return pf&&savePlan();

  if(a==="back"){psel=null;return render()}
  if(a==="rowedit"){if(!pf)return;const r=pf.rows[+el.dataset.k];if(r){r.editing=!r.editing;payDraw()}return}
  const pe=el.closest("[data-plan]");if(pe)psel=pe.dataset.plan;
  const p=payments.find(x=>x.id===psel);if(!p)return;
  if(a==="edit")return payForm(p);
  if(a==="del"){if(!armed(el,"Tap again to delete"))return;return removePay(p)}
  const i=(p.installments||[]).find(x=>x.id===el.dataset.i),k=p.installments.indexOf(i);if(!i)return;
  if(a==="paid"||a==="editpaid")return paidForm(p,i);
  if(a==="unpaid"){delete i.paidOn;delete i.paidAmt;delete i.mode;delete i.ref;payLog(p,`Installment ${k+1} marked unpaid`);close();toast("↩️","Marked unpaid");return savePay(p)}
  if(a==="savepaid"){
    const amt=toP(val("pp_amt")),dt=val("pp_date");if(amt<=0)return err("Enter the amount received");if(!dt)return err("Pick the payment date");
    const wasPaid=!!i.paidOn,diff=amt!==toP(i.amount);Object.assign(i,{paidOn:dt,paidAmt:fromP(amt),amount:fromP(amt),mode:val("pp_mode"),ref:val("pp_ref")});
    const un=p.installments.filter(x=>!x.paidOn);
    if(diff&&un.length){const rest=Math.max(0,toP(p.total)-p.installments.filter(x=>x.paidOn).reduce((s,x)=>s+toP(paidAmt(x)),0)),sp=splitP(rest,un.length);un.forEach((x,j)=>x.amount=fromP(sp[j]))}
    payLog(p,`Installment ${k+1} ${wasPaid?"payment edited":"paid"} · ${inr(fromP(amt))}${i.mode?" via "+i.mode:""}`);close();
    toast("✅",diff&&un.length?"Payment saved · remaining installments re-balanced":"Payment recorded");return savePay(p)}
}

const EXP_MODES=["UPI","Bank transfer","Cheque","Cash","Card","Auto-debit","Other"];
GI.expenses=sv(P.receipt='<path d="M4 2v20l2.5-1.5L9 22l2.5-1.5L14 22l2.5-1.5L19 22V2l-2.5 1.5L14 2l-2.5 1.5L9 2 6.5 3.5z"/><path d="M8 7h8M8 11h8M8 15h5"/>',22);

/* day-by-day transactions, newest first — expenses, income records and payments collected */
function expTx(list,ilist,coll,f){
  const rows=list.map(e=>({...e,_t:"o"})).concat(ilist.map(e=>({...e,_t:"i"})),coll.map(x=>({...x,_t:"p"})));

  const out=sumP(list),into=sumP(ilist)+sumP(coll);

/* summary: visual breakdowns by category, then a month-by-month chart */
function brkRows(recs,extra){

function expSummary(list,ilist,coll){

/* Educlawd CRM · School Network (admin only): every won school with its contract details.
   The extra details live on the school document itself (s.net), so they sync like any other school field. */
const NET_TERMS=[[12,"1 year"],[24,"2 years"],[36,"3 years"],[6,"6 months"],[60,"5 years"]];
GI.network=sv(P.net='<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M12 8v4M12 12 6.8 16.3M12 12l5.2 4.3"/>',22);
let nsel=null,ndt="contract",nst="all",nsrt="value",npf="all";
const wonSchools=()=>schools.filter(s=>s.stage==="Won");
const wonOf=p=>p&&p.schoolId?wonSchools().find(s=>s.id===p.schoolId):null; // the network school a payment plan belongs to
function payFocus(p){const ws=wonOf(p);gtab="network";if(ws){nsel=ws.id;psel=null;ndt="pay"}else{psel=p.id;nsel=null}}
const netOf=s=>s.net||{};
const termLabel=m=>(NET_TERMS.find(x=>x[0]===+m)||[0,m?+m+" months":""])[1];
const netEnd=s=>{const n=netOf(s);if(!(n.billStart&&+n.term))return"";const d=new Date(addMonths(n.billStart,+n.term)+"T12:00");d.setDate(d.getDate()-1); // the contract ends the day before the anniversary
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const netLeft=s=>{const e=netEnd(s);if(!e)return null;return Math.ceil((new Date(e+"T12:00")-Date.now())/864e5)};
const salesOf=s=>ulabel(owner(s));
const netPct=s=>{const n=netOf(s),e=netEnd(s);if(!n.billStart||!e)return null;
  const a=new Date(n.billStart+"T12:00").getTime(),b=new Date(e+"T12:00").getTime(),now=Date.now();
  return b<=a?0:Math.max(0,Math.min(100,Math.round((now-a)*100/(b-a))))};
const netState=s=>{const l=netLeft(s);return l===null?"pend":l<0?"exp":l<=90?"soon":"live"};
const NSTL={live:["Active","s-Won"],soon:["Renewing soon","s-Proposal"],exp:["Expired","s-Lost"],pend:["Details pending","s-Lead"]};
const netPay=s=>{const ps=payments.filter(p=>p.schoolId===s.id);if(!ps.length)return null;
  return ps.reduce((a,p)=>{const m=planSum(p),nx=m.next;return{tot:a.tot+m.tot,paid:a.paid+m.paid,due:a.due+m.due,n:a.n+1,over:a.over+m.oc,np:a.np+m.np,ni:a.ni+m.n,st:a.st==="over"||m.status==="over"?"over":a.st==="pend"||m.status==="pend"?"pend":"done",next:nx&&(!a.next||(nx.due||"9")<(a.next.due||"9"))?nx:a.next}},{tot:0,paid:0,due:0,n:0,over:0,np:0,ni:0,st:"done",next:null})};

function netMetrics(){
  const w=wonSchools(),tv=w.reduce((a,s)=>a+insVal(s),0);
  let live=0,soon=0,pend=0;
  w.forEach(s=>{const l=netLeft(s);if(l===null){pend++;return}if(l<0)return;live++;if(l<=90)soon++});
  return{n:w.length,tv,live,soon,pend};

function netSave(id){
  const s=schools.find(x=>x.id===id);if(!s)return;
  const sg=val("n_sign"),bill=val("n_bill"),term=val("n_term"),ph=val("n_phone");
  if(ph&&!/^\d{10}$/.test(ph))return err("Phone number must be exactly 10 digits");
  if(bill&&sg&&bill<sg)return err("Billing can't start before the signing date");
  const o=structuredClone(s),was=netOf(s);
  if(sg)o.deal=Object.assign({},o.deal||{},{signing:sg});
  o.net={billStart:bill,term:term?+term:"",person:val("n_person"),pdesig:val("n_desig"),pphone:ph,pemail:val("n_email"),notes:val("n_notes")};
  const ch=[];
  if((was.billStart||"")!==o.net.billStart)ch.push("billing start");
  if(String(was.term||"")!==String(o.net.term||""))ch.push("contract period");
  if((was.person||"")!==o.net.person)ch.push("authorised person");
  if(((s.deal&&s.deal.signing)||"")!==sg&&sg)ch.push("signing date");
  if(ch.length)log(o,"Update","Contract details updated: "+ch.join(", "));
  nsel=o.id;close();toast("🤝","Contract details saved");save(o);
}
function netAct(el){
  const a=el.dataset.net;
  if(a==="back"){nsel=null;return render()}
  if(a==="save")return netSave(el.dataset.id);
  const s=schools.find(x=>x.id===nsel);if(!s)return;
  if(a==="edit")return netForm(s);
  if(a==="remind"){
    const end=netEnd(s);if(!end)return;
    const d=new Date(end+"T10:00");d.setDate(d.getDate()-30);
    if(d.getTime()<Date.now()){d.setTime(Date.now()+864e5);d.setHours(10,0,0,0)}
    const ti="Renewal due "+fmtDate(end)+" — confirm with "+(netOf(s).person||"the school");
    if((s.tasks||[]).some(t=>t.title===ti))return toast("📅","Reminder already set");
    const o=structuredClone(s);
    (o.tasks=o.tasks||[]).push({id:uid(),type:"Call",title:ti,due:d.toISOString(),by:me?me.name:undefined,byId:me?me.id:undefined});
    log(o,"Task",`Call task added: ${ti} (due ${fmt(d)})`);
    toast("📅","Renewal reminder set for "+fmtDate(localISO(d).slice(0,10)));return save(o)}
}

    if(m==="close")return close();
    if(m==="genpw"){document.getElementById("u_pw").value=genPw();return}
    if(m==="saveUser")return saveUser(el);
    if(m==="delUser")return delUser(el);
    if(m==="chpw")return pwForm();
    if(m==="savePw")return savePw();
    if(m==="signout")return signOut();
    if(m==="saveSchool"){const n=val("f_name");if(!n)return err("School name is required");if(val("f_phone")&&!/^\d{10}$/.test(val("f_phone")))return err("Phone number must be exactly 10 digits");
      const old=schools.find(x=>x.id===el.dataset.id),o=old?structuredClone(old):{id:uid(),stage:"Lead",created:new Date().toISOString(),createdBy:me?me.name:undefined,createdById:me?me.id:undefined};
      const nw={name:n,phone:val("f_phone"),strength:val("f_strength"),board:val("f_board"),city:getCity(),state:val("f_state"),address:val("f_address")};
      const ch=Object.keys(nw).filter(k=>String(o[k]||"")!==nw[k]);Object.assign(o,nw);
      const ns=val("f_stage")||"Lead",stCh=old&&(o.stage||"Lead")!==ns;o.stage=ns;
      const ds=+val("f_strength")||+((o.deal||{}).students)||0,dp=+val("e_dp")||0,db=val("e_db"),sd=document.getElementById("e_sd").value;let dealCh=false;
      if(ds>0&&dp>0){const od=o.deal||{};if(od.students!==ds||od.price!==dp||od.basis!==db||(od.signing||"")!==sd){o.deal={students:ds,price:dp,basis:db,signing:sd};dealCh=true}}
      if(ch.length||!old)log(o,"Update",old?"Details updated: "+ch.join(", "):"School added to CRM");
      if(stCh)log(o,"Update","Stage changed to "+ns);
      if(dealCh){const c=calc(o.deal);log(o,"Deal",`${ds} students × ${inr(dp)} per ${db==="year"?"year":"month"} = ${inr(c.m)}/month + 18% GST = ${inr(c.mt)}/month (${inr(c.yt)}/year)${sd?" · signing date "+fmtDate(sd):""}`)}
      if(isAdmin()){const ow=val("f_owner");if(ow&&ow!==(old?(old._owner||""):me.id))o._assign=ow}
      sel=o.id;if(!old)tab="activity";close();toast(old?"✏️":"🏫",old?(dealCh?"School & deal details updated successfully":"School details updated successfully"):"School added successfully");return save(o)}
    if(m==="saveResched"){const ss=schools.find(x=>x.id===reschSid),tk=ss&&(ss.tasks||[]).find(x=>x.id===el.dataset.id),du=dueVal("r_due");if(!tk)return close();if(!du)return err("Pick a date and time");
      const dt=new Date(du);tk.due=dt.toISOString();log(ss,"Task",`Rescheduled: ${tk.title} → ${fmt(dt)}`);close();toast("🗓️","Task rescheduled successfully");return save(ss)}
    if(!s)return;
    if(m==="saveContact"){if(!val("c_name"))return err("Name is required");if(val("c_phone")&&!/^\d{10}$/.test(val("c_phone")))return err("Phone number must be exactly 10 digits");
      s.contacts=s.contacts||[];const id=el.dataset.id,p=s.contacts.find(x=>x.id===id)||{id:uid()};
      Object.assign(p,{name:val("c_name"),phone:val("c_phone"),email:val("c_email"),designation:desVal()});
      if(!id)s.contacts.push(p);log(s,"Update",`Contact ${id?"updated":"added"}: ${p.name}${p.designation?" ("+p.designation+")":""}`);close();toast("👤",id?"Contact updated successfully":"Contact added successfully");return save(s)}
    if(m==="delContact"){if(!armed(el,"Click again to confirm delete"))return;s.contacts=s.contacts.filter(x=>x.id!==el.dataset.id);close();toast("🗑️","Contact deleted");return save(s)}
    if(m==="saveTask"){const ti=val("t_title"),du=dueVal("t_due");if(!ti)return err("Enter what needs to be done");if(!du)return err("Pick a date and time");
      const dt=new Date(du),val_t=val("t_type"),cs=s.contacts||[],ce=document.getElementById("t_contact"),cid=ce?ce.value:(cs.length===1?cs[0].id:""),cn=(cs.find(x=>x.id===cid)||{}).name;
      (s.tasks=s.tasks||[]).push({id:uid(),type:val("t_type"),title:ti,due:dt.toISOString(),contactId:cid,by:me?me.name:undefined,byId:me?me.id:undefined});
      log(s,"Task",`${val("t_type")} task added: ${ti}${cn?" · "+cn:""} (due ${fmt(dt)})`);close();toast(ICON[val_t]||"✅",`${val_t} task added successfully`);return save(s)}
    if(m==="saveAct"){if(!val("a_text"))return err("Describe the activity");const ty=val("a_type");log(s,ty,val("a_text"),ty==="Note"?"note":"activity");close();toast(ICON[ty]||"✅",`${ty} logged successfully`);return save(s)}
  }
  if(el=g("data-done")){const ss=(el.dataset.sid&&schools.find(x=>x.id===el.dataset.sid))||s,tk=ss&&(ss.tasks||[]).find(x=>x.id===el.dataset.done);if(tk){ss.tasks=ss.tasks.filter(x=>x!==tk);log(ss,tk.type,`Completed: ${tk.title}`,"task_done");toast("✅","Task completed");save(ss)}return}
  if(el=g("data-resch")){const ss=(el.dataset.sid&&schools.find(x=>x.id===el.dataset.sid))||s,tk=ss&&(ss.tasks||[]).find(x=>x.id===el.dataset.resch);if(tk){reschSid=ss.id;reschedForm(tk)}return}
  if(!s)return;
  if(el=g("data-act")){const a=el.dataset.act;
    if(a==="back"){sel=null;return render()}
    if(a==="edit")return schoolForm(s);
    if(a==="itab"){itab=el.dataset.v;return render()}
    if(a==="addContact")return contactForm();
    if(a==="addTask")return taskForm();
    if(a==="logAct")return actForm();
  }
  if(el=g("data-editc"))return contactForm((s.contacts||[]).find(x=>x.id===el.dataset.editc));
}
document.addEventListener("click",e=>{try{onClick(e)}catch(x){console.error(x);toast("⚠️","Something went wrong: "+x.message)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("#auth").classList.contains("show")){const b=document.querySelector("#auth [data-au=login],#auth [data-au=setup]");if(b){e.preventDefault();b.click()}}});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.an){an[e.target.dataset.an]=e.target.value;an.lim=30;an.pg=1;render();return}
  const s=cur();if(s&&e.target.dataset&&e.target.dataset.act==="stage"){s.stage=e.target.value;log(s,"Update","Stage changed to "+s.stage);toast("🔄","Stage changed to "+s.stage);save(s)}});
document.addEventListener("input",e=>{if(["f_strength","e_dp","e_db"].includes(e.target.id))editPrev();payInput(e)});
document.addEventListener("change",e=>{if(e.target&&e.target.dataset&&e.target.dataset.nsrt){nsrt=e.target.value;render();return}});
document.addEventListener("change",e=>{const d=e.target&&e.target.dataset&&e.target.dataset.exs;if(!d)return;if(d==="exm")exm=e.target.value;else exc=e.target.value;render()});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="ex_cat"){const i=document.getElementById("ex_newcat");if(i){i.style.display=e.target.value==="__new"?"":"none";if(e.target.value==="__new")i.focus()}}});
document.addEventListener("change",payChange);
document.addEventListener("change",e=>{if(e.target&&e.target.id==="c_dsel"){const i=document.getElementById("c_des");if(!i)return;const o=e.target.value==="Other";i.style.display=o?"":"none";if(o)i.focus();else i.value=""}});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="f_state")cityRefill()});
document.addEventListener("input",e=>{if(e.target.id==="mq"){mq=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById("mq");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
$("#q").addEventListener("input",e=>{filter=e.target.value;render()});
addEventListener("resize",render);
init();

</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
